[project]
name = "nqgc"
version = "0.1.0"
description = "Research + backtests for a fixed 0.5R (reward:risk) bracket strategy on NQ and GC futures"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "requests>=2.31",
    "numba>=0.60",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
research = ["scikit-learn>=1.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
